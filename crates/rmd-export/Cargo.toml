[package]
name = "rmd-export"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
docx-rs = "0.4.22"
epub-builder = { version = "0.8.3", default-features = false, features = ["zip-library"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
resvg = "0.50.0"
rmd-core = { version = "0.1.0", path = "../rmd-core" }
thiserror = "2.0.21"
typst = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
typst-layout = "0.15.1"
typst-pdf = "0.15.1"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
zip = "8"
