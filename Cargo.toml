[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
# `deny` rather than `forbid`: the app needs one audited `unsafe` call to show a
# native context menu (see rmd-app/src/editor.rs).
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2

# Used by CI: fast to compile (no debug info, unoptimised dependencies).
[profile.ci]
inherits = "dev"
debug = 0

[profile.ci.package."*"]
opt-level = 0
