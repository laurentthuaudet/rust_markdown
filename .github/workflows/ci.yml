name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes older runs on the same branch pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Keep compiled dependencies even if a later step fails.
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      # The `ci` profile (see Cargo.toml) skips debug info and dependency
      # optimisation: much faster to build, and clippy and tests share it.
      - run: cargo clippy --workspace --all-targets --profile ci -- -D warnings
      - run: cargo test --workspace --profile ci
